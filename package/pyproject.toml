[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "parakeet-stt"
version = "0.1.0"
description = "Local speech-to-text on NVIDIA Parakeet with a native C++ inference core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
parakeet = "parakeet_stt.cli:main"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/parakeet_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
