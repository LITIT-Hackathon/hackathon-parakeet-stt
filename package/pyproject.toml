[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "parakeet-stt"
version = "0.1.0"
description = "Local speech-to-text on NVIDIA Parakeet with a native C++ inference core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aleksandras Bacevičius" },
    { name = "Edvinas Ryliškis" },
    { name = "Jokūbas Jakas" },
]
keywords = ["speech-to-text", "asr", "transcription", "parakeet", "gguf", "offline", "cpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "platformdirs>=4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/LITIT-Hackathon/hackathon-parakeet-stt"
Issues = "https://github.com/LITIT-Hackathon/hackathon-parakeet-stt/issues"

[project.scripts]
parakeet = "parakeet_stt.cli:main"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/parakeet_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
