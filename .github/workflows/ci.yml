name: package CI

# Safety net for the package. Every push / PR touching package/ does a clean
# from-source build and runs the suite. The build fetches parakeet.cpp at the
# pinned commit and compiles it into the extension, so a break in the bundled
# native build fails here rather than at install time for a user.
#
# The native-tier tests need a model (not shipped yet) and skip without one;
# what CI proves is that `pip install` yields a working native extension on a
# machine that has never seen the source.

on:
  push:
    paths:
      - "package/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "package/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: package

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # no model weights needed

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install (fetches + compiles parakeet.cpp)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Backend is native
        run: |
          parakeet info
          parakeet info | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d['native'] else 'not native')"

      - name: Test
        run: pytest -q

  native-model:
    # Proves native inference end to end: build from source, fetch the release
    # model once (cached across runs), run the full native tier -- the tests
    # that are @needs_model and otherwise only ever run by hand.
    runs-on: ubuntu-latest
    env:
      PARAKEET_CACHE_DIR: ${{ github.workspace }}/pk-cache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pk-cache
          # bump when the registry model changes
          key: parakeet-model-models-v1-q8_0

      - name: Fetch model if not cached
        run: parakeet download-model      # instant marker check on a cache hit

      - name: Native tier
        run: |
          PARAKEET_MODEL="$PARAKEET_CACHE_DIR/models/parakeet-tdt-0.6b-v3.q8_0.gguf" \
            pytest -q

  stub:
    # The stub still has to build and pass on its own -- it is the offline / no
    # C++ engine path and the fallback if the fetch is unavailable. Also the
    # cheapest place to check the built wheel's metadata and contents.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stub and test
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' --config-settings=cmake.define.PARAKEET_STT_BUNDLED=OFF
          parakeet info | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if not d['native'] else 'expected stub')"
          pytest -q
      - name: Wheel metadata and contents
        run: |
          pip install --upgrade build twine
          python -m build --wheel --config-setting=cmake.define.PARAKEET_STT_BUNDLED=OFF
          twine check dist/*
          python -c "import glob,zipfile,sys; w=glob.glob('dist/parakeet_stt-*.whl')[0]; ns=zipfile.ZipFile(w).namelist(); sys.exit(0 if any(n.endswith('parakeet_stt/py.typed') for n in ns) else 'py.typed missing from wheel: '+w)"

  clean-room:
    # The reproducibility deliverable, checked the way a judge would: from a
    # directory that has never seen the source, follow the README and get a
    # working native install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reproduce from a clean clone
        working-directory: ${{ github.workspace }}
        run: |
          cp -r src/package /tmp/clean
          cd /tmp/clean
          python -m venv .venv
          . .venv/bin/activate
          pip install -e '.[test]'
          parakeet info
          parakeet info | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d['native'] else 'not native')"
          pytest -q
